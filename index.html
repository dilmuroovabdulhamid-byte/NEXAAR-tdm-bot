<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXAR ESPORTS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #08080a; color: #fff; padding: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #1f1f24; padding-bottom: 10px; }
        .brand { font-family: 'Impact', sans-serif; font-size: 26px; color: #ff2424; letter-spacing: 1px; }
        .card { background: #121215; border: 1px solid #222; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
        .prize-img { width: 100%; height: 140px; object-fit: cover; background: #1a1a20; }
        .card-body { padding: 14px; }
        .tourney-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; font-size: 12px; color: #aaa; }
        .info-box { background: #0a0a0c; padding: 6px 8px; border-radius: 6px; }
        .info-box span { color: #fff; font-weight: bold; display: block; font-size: 13px; }
        .btn-main { width: 100%; background: #ff2424; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-main:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">NEXAR ESPORTS</div>
        <div style="font-size: 12px; color: #888;">Admin: <b style="color:#ff2424;">@mirzhayev</b></div>
    </div>

    <div id="tournaments-list">
        <p style="text-align:center; color:#888; padding: 20px;">Turnirlar yuklanmoqda...</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function loadTournaments() {
            try {
                // tournaments.json faylidan turnirlarni o'qish
                const response = await fetch('tournaments.json?' + new Date().getTime());
                const data = await response.json();
                
                const container = document.getElementById('tournaments-list');
                container.innerHTML = '';

                if(!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#888; padding: 20px;">Hozircha faol turnirlar yo\'q.</p>';
                    return;
                }

                data.forEach(item => {
                    container.innerHTML += `
                        <div class="card">
                            <img src="${item.img}" class="prize-img" alt="Prize">
                            <div class="card-body">
                                <div class="tourney-title">${item.title}</div>
                                <div class="info-grid">
                                    <div class="info-box">Vaqti: <span>${item.time}</span></div>
                                    <div class="info-box">Kirish: <span>${item.price}</span></div>
                                    <div class="info-box">Bosh Priz: <span style="color:#4cd964;">${item.prize}</span></div>
                                    <div class="info-box">Rejim: <span>${item.mode}</span></div>
                                </div>
                                <button class="btn-main" onclick="sendToAdmin('${item.title}')">Qatnashish (Adminga yozish)</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error(e);
                document.getElementById('tournaments-list').innerHTML = '<p style="text-align:center; color:#ff2424; padding: 20px;">Turnirlarni yuklashda xatolik bo\'ldi.</p>';
            }
        }

        function sendToAdmin(itemName) {
            const messageText = `Salom! Men NEXAR Esports bo'yicha ${itemName}da qatnashmoqchiman.`;
            tg.openTelegramLink(`https://t.me/mirzhayev?text=${encodeURIComponent(messageText)}`);
        }

        loadTournaments();
    </script>
</body>
</html>
